                    message: "Internal server error"
                    status: 500
                    timestamp: "null"
                Example#2:
                  description: ""
                  value:
                    message: "Internal server error"
                    status: 500
                    timestamp: "null"
                Example#3:
                  description: ""
                  value:
                    message: "Internal server error"
                    status: 500
                    timestamp: "null"
        "422":
          description: "Unprocessable Entity"
