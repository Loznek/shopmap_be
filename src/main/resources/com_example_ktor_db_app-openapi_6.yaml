  /calculate-route:
    post:
      summary: "11. Run a Held-Karp route calcutaion algorithm"
      description: |
        The Held-Karp function running on 10 given products through 7 departments. 
        The calculated route is 251 meters long.
        The picture below visualizes the path with yellow dots.
        <a href="https://raw.githubusercontent.com/Loznek/shopmap_be/refs/heads/main/src/main/resources/SwaggerTestResources/debug_route_floorplan.png" target="_blank">
          The optimal route
        </a>

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutePlanningRequest"
            example:
              mapId: 2

              products:
                - articleNo: 7
                  departmentId: 3
                  position: LEFT

                - articleNo: 4
                  departmentId: 1
                  position: RIGHT

                - articleNo: 10
                  departmentId: 6
                  position: TOP

                - articleNo: 5
                  departmentId: 5
                  position: TOP

                - articleNo: 19
                  departmentId: 7
                  position: BOTTOM

                - articleNo: 8
                  departmentId: 4
                  position: RIGHT

                - articleNo: 6
                  departmentId: 2
                  position: RIGHT

                - articleNo: 9
                  departmentId: 4
                  position: LEFT

                - articleNo: 14
                  departmentId: 4
                  position: TOP

                - articleNo: 18
                  departmentId: 2
                  position: TOP
        required: true
      responses:
        "404":
          description: "Not Found"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                Example#1:
                  description: ""
                  value:
                    message: "null"
                    status: 404
                    timestamp: "null"
                Example#2:
                  description: ""
                  value:
                    message: "null"
                    status: 404
                    timestamp: "null"
        "500":
          description: "Internal Server Error"
          content:
            '*/*':
              schema:
