components:
  securitySchemes:
    FirebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: "object"
      properties:
        message:
          type: "string"
        status:
          type: "integer"
          format: "int32"
        timestamp:
          type: "integer"
          format: "int64"
      required:
        - "message"
        - "status"
        - "timestamp"
    UpdateShoppingListRequest:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        name:
          type: "string"
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/CreateShoppingListItemRequest"
      required:
        - "id"
        - "name"
        - "items"
    LoginRequest:
      type: "object"
      properties:
        email:
          type: "string"
        password:
          type: "string"
      required:
        - "email"
        - "password"
    AuthTokenResponse:
      type: "object"
      properties:
        token:
          type: "string"
      required:
        - "token"
    RoutePlanningProductRequest:
      type: "object"
      properties:
        articleNo:
          type: "integer"
          format: "int32"
        departmentId:
          type: "integer"
          format: "int32"
        position:
